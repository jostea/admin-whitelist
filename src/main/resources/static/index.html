<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zomboid Admin Panel</title>
  <style>
    html { background: url('/images/background.png') center / cover no-repeat fixed; min-height: 100%; }
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 1rem 1.5rem;
           background: rgba(255, 255, 255, .88); border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, .3); }
    section { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    button, .button { padding: .5rem 1rem; margin: .25rem .25rem .25rem 0; cursor: pointer;
                      border: 1px solid #888; border-radius: 4px; background: #f4f4f4;
                      color: inherit; text-decoration: none; font-size: .9rem; display: inline-block; }
    button.danger { background: #fbe3e3; border-color: #c33; }
    input { padding: .45rem; }
    .tabs { border-bottom: 1px solid #ccc; margin-bottom: 1rem; }
    .tabs button { margin: 0 .25rem -1px 0; border-radius: 4px 4px 0 0; border-color: #ccc; }
    .tabs button.active { background: #fff; border-bottom-color: #fff; font-weight: bold; }
    .tab { display: none; }
    .tab.active { display: block; }
    .give-item-row { display: flex; gap: .5rem; align-items: flex-end; flex-wrap: wrap; }
    .give-item-row label { display: flex; flex-direction: column; font-size: .85rem; gap: .25rem; }
    .give-item-row select, .give-item-row input { padding: .45rem; min-width: 10rem; }
    .item-search { position: relative; }
    .item-search input { width: 16rem; }
    #item-suggestions { position: absolute; top: 100%; left: 0; right: 0; z-index: 10; margin: 0; padding: 0;
                        list-style: none; background: #fff; border: 1px solid #ccc; max-height: 250px; overflow: auto; }
    #item-suggestions:empty { display: none; }
    #item-suggestions li { padding: .35rem .5rem; cursor: pointer; }
    #item-suggestions li:hover { background: #eef; }
    #output { background: #111; color: #ddd; padding: 1rem; border-radius: 6px;
              min-height: 4rem; max-height: 400px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
<h1>Zomboid Admin Panel</h1>

<nav class="tabs">
  <button data-tab="server" onclick="showTab('server')">Server</button>
  <button data-tab="events" onclick="showTab('events')">Events</button>
  <button data-tab="items" onclick="showTab('items')">Items</button>
</nav>

<div class="tab" id="tab-server">
<section>
  <h2>Whitelist</h2>
  <a class="button" id="open-whitelist" href="/players-whitelist">Open whitelist page</a>
  <div>
    <input type="text" id="rest-username" placeholder="Username">
    <button id="add-player" onclick="addPlayer()">Add player</button>
  </div>
</section>

<section>
  <h2>Server info</h2>
  <button id="health-check" onclick="call('GET', '/health-check')">Health check</button>
  <button id="players-amount" onclick="call('GET', '/get-amount-of-players')">Players online</button>
</section>

<section>
  <h2>Logs</h2>
  <button id="admin-logs" onclick="call('GET', '/get-admin-logs')">Admin logs</button>
  <a class="button" id="debug-log" href="/get-debug-log-server" target="_blank">Debug log (new tab)</a>
</section>

<section>
  <h2>Server control</h2>
  <button id="save-server" onclick="call('GET', '/save-server')">Save server</button>
  <button id="restart-server" class="danger"
          onclick="confirmAndCall('Restart the server?', '/restart-pz-server')">Restart server</button>
  <button id="terminate-server" class="danger"
          onclick="confirmAndCall('Stop the server?', '/terminate-server')">Terminate server</button>
</section>
</div>

<div class="tab" id="tab-events">
<section>
  <h2>World events</h2>
  <button id="chopper-event" onclick="call('GET', '/make-event/chopper')">Chopper</button>
  <button id="gunshot-event" onclick="call('GET', '/make-event/gunshot')">Gunshot</button>
</section>
</div>

<div class="tab" id="tab-items">
<section>
  <h2>Give item to player</h2>
  <div class="give-item-row">
    <label>Player
      <select id="item-player"></select>
    </label>
    <button id="refresh-players" title="Reload online players" onclick="loadPlayers()">&#x21bb;</button>
    <label>Item
      <span class="item-search">
        <input type="text" id="item-name" placeholder="Start typing item name" autocomplete="off"
               oninput="searchItems(this.value)">
        <ul id="item-suggestions"></ul>
      </span>
    </label>
    <label>Amount
      <select id="item-count">
        <option>1</option>
        <option>5</option>
        <option>10</option>
      </select>
    </label>
    <button id="give-item" onclick="giveItem()">Add</button>
  </div>
</section>
</div>

<h2>Output</h2>
<div id="output">Click a button to see the response here.</div>

<script>
  const output = document.getElementById('output');

  function showTab(name) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.id === 'tab-' + name));
    document.querySelectorAll('.tabs button').forEach(button => button.classList.toggle('active', button.dataset.tab === name));
    history.replaceState(null, '', '#' + name);
    if (name === 'items' && !document.getElementById('item-player').options.length) {
      loadPlayers();
    }
  }

  async function call(method, url, body) {
    output.textContent = method + ' ' + url + ' ...';
    try {
      const options = body
        ? { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
        : { method };
      const response = await fetch(url, options);
      const text = await response.text();
      output.textContent = method + ' ' + url + ' -> ' + response.status + '\n\n' + (text || '(empty response)');
    } catch (e) {
      output.textContent = method + ' ' + url + ' failed: ' + e;
    }
  }

  function confirmAndCall(message, url) {
    if (confirm(message)) {
      call('GET', url);
    }
  }

  function valueOf(id) {
    const value = document.getElementById(id).value.trim();
    if (!value) {
      output.textContent = 'Please fill in the field first.';
    }
    return value;
  }

  function addPlayer() {
    const username = valueOf('rest-username');
    if (username) {
      call('POST', '/rest-players-whitelist/add/' + encodeURIComponent(username));
    }
  }

  async function loadPlayers() {
    const select = document.getElementById('item-player');
    select.innerHTML = '<option value="">Loading...</option>';
    try {
      const players = await (await fetch('/give-item/players')).json();
      select.innerHTML = players.length ? '' : '<option value="">No players online</option>';
      players.forEach(player => select.add(new Option(player, player)));
    } catch (e) {
      select.innerHTML = '<option value="">Unable to load players</option>';
    }
  }

  let searchTimer;

  function searchItems(prefix) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      const list = document.getElementById('item-suggestions');
      list.innerHTML = '';
      if (!prefix.trim()) {
        return;
      }
      const items = await (await fetch('/give-item/items?prefix=' + encodeURIComponent(prefix.trim()))).json();
      items.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        li.onclick = () => {
          document.getElementById('item-name').value = item;
          list.innerHTML = '';
        };
        list.appendChild(li);
      });
    }, 200);
  }

  function giveItem() {
    const username = valueOf('item-player');
    const item = valueOf('item-name');
    if (username && item) {
      call('POST', '/give-item', { username, item, count: Number(document.getElementById('item-count').value) });
    }
  }

  showTab(document.getElementById('tab-' + location.hash.slice(1)) ? location.hash.slice(1) : 'server');
</script>
</body>
</html>
